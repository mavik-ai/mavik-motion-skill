name: Quality checks
on:
  push:
  pull_request:
jobs:
  skill-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check skill and storyboard
        run: |
          npm run release:check
          npm test
          npm run brief:check
          npm run storyboard:check
          npm run demo:plan
          node scripts/doctor.mjs --json
